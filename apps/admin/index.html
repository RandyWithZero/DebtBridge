<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DebtBridge 后台管理</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/admin.css" />
  </head>
  <body>
    <main id="admin-app" tabindex="-1"></main>
    <script>
      const explicitApiBase = new URLSearchParams(location.search).get("api");
      const defaultApiBase = "";
      window.DEBTBRIDGE_API_BASE = explicitApiBase || defaultApiBase;
      localStorage.setItem("debtbridgeApiBase", window.DEBTBRIDGE_API_BASE);
    </script>
    <script type="module" src="/admin.js"></script>
  </body>
</html>
