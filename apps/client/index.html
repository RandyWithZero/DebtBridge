<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DebtBridge | 债务人与机构登录访问</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" data-link aria-label="DebtBridge 首页">
        <span class="brand-mark">DB</span>
        <span>DebtBridge</span>
      </a>
      <nav class="top-nav" aria-label="主导航">
        <a href="/" data-link>服务流程</a>
        <a href="/" data-link>适合人群</a>
        <a href="/service" data-link>合规边界</a>
        <a href="/partner/login" data-link>机构合作</a>
        <a class="nav-action" href="/debtor/login" data-link>债务人申请</a>
        <a class="nav-action" href="/partner/login" data-link>机构入驻</a>
      </nav>
      <button class="mobile-menu" type="button" aria-label="展开导航" aria-expanded="false">菜单</button>
    </header>

    <main id="app" tabindex="-1"></main>

    <footer class="footer">
      <strong>DebtBridge</strong>
      <span>本平台仅提供债务信息撮合、咨询与对接服务；不放贷、不催收、不代收款、不承诺协商结果。</span>
    </footer>

    <script>
      const explicitApiBase = new URLSearchParams(location.search).get("api");
      const defaultApiBase = `${location.protocol}//${location.hostname}:3000`;
      window.DEBTBRIDGE_API_BASE = explicitApiBase || defaultApiBase;
      localStorage.setItem("debtbridgeApiBase", window.DEBTBRIDGE_API_BASE);
    </script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
