name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: debtbridge
          POSTGRES_USER: debtbridge
          POSTGRES_PASSWORD: debtbridge_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U debtbridge -d debtbridge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://debtbridge:debtbridge_dev_password@localhost:5432/debtbridge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run API tests
        run: npm test

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Validate database migration
        run: npm run db:migrate

      - name: Validate local seed data
        run: npm run db:seed

      - name: Validate Compose file
        run: docker compose config

      - name: Build application image
        run: docker build -t debtbridge:${{ github.sha }} .
